an a plain hola.",example:["Buenos días, Ana.","Buenos días."]},{es:"Buenas noches",en:"Good evening / Good night",explain:"Use this after dark — both to greet someone in the evening and to say good night when you leave.",example:["Buenas noches.","Buenas noches, Ana."]}],exercises:[{type:"mc",prompt:"What does this mean?",phrase:"Hola",options:["Hello","Goodbye","Good morning","Good night"],answer:"Hello"},{type:"listen",prompt:"What do you hear?",speak:"Hola",options:["Hola","Adiós","Buenos días","Buenas noches"],answer:"Hola"},{type:"mc",prompt:"Translate to Spanish",phrase:"Goodbye",options:["Adiós","Hola","Buenos días","Buenas noches"],answer:"Adiós"},{type:"tap",prompt:"Translate to Spanish",phrase:"Hello",bank:["Hola","Adiós","Buenos","días"],answer:["Hola"]},{type:"match",prompt:"Tap the matching pairs",pairs:[["Hello","Hola"],["Goodbye","Adiós"],["Good morning","Buenos días"],["Good night","Buenas noches"]]},{type:"listen",prompt:"What do you hear?",speak:"Adiós",options:["Adiós","Hola","Buenos días","Buenas noches"],answer:"Adiós"},{type:"tap",prompt:"Translate to Spanish",phrase:"Good morning",bank:["Buenos","días","Buenas","noches","Hola","Adiós"],answer:["Buenos","días"]},{type:"mc",prompt:"What does this mean?",phrase:"Buenas noches",options:["Good night","Good morning","Goodbye","Hello"],answer:"Good night"}]},{id:"u1l2",title:"Thanks & please",icon:"🙏",teach:[{es:"Gracias",en:"Thank you",explain:"Say this whenever someone helps you, gives you something, or is kind to you.",example:["Aquí tienes.","Gracias."]},{es:"Por favor",en:"Please",explain:"Add this to a request to sound polite. It can go at the end of the sentence.",example:["Un café, por favor.","Claro."]},{es:"De nada",en:"You're welcome",explain:'This is the usual reply after someone says gracias. It literally means "it\'s nothing."',example:["Gracias.","De nada."]},{es:"Lo siento",en:"I'm sorry",explain:"Use this to apologize, or to show you feel sorry for someone.",example:["Lo siento.","De nada, no pasa nada."]}],exercises:[{type:"mc",prompt:"What does this mean?",phrase:"Gracias",options:["Thank you","Please","Sorry","Hello"],answer:"Thank you"},{type:"listen",prompt:"What do you hear?",speak:"Gracias",options:["Gracias","De nada","Por favor","Hola"],answer:"Gracias"},{type:"mc",prompt:"Translate to Spanish",phrase:"Please",options:["Por favor","Gracias","De nada","Lo siento"],answer:"Por favor"},{type:"tap",prompt:"Translate to Spanish",phrase:"Thank you",bank:["Gracias","Por","favor","Hola","Adiós"],answer:["Gracias"]},{type:"match",prompt:"Tap the matching pairs",pairs:[["Thanks","Gracias"],["Please","Por favor"],["You're welcome","De nada"],["Sorry","Lo siento"]]},{type:"listen",prompt:"What do you hear?",speak:"Por favor",options:["Por favor","De nada","Gracias","Lo siento"],answer:"Por favor"},{type:"tap",prompt:"Translate to Spanish",phrase:"You're welcome",bank:["De","nada","Por","favor","Gracias","Hola"],answer:["De","nada"]},{type:"mc",prompt:"What does this mean?",phrase:"De nada",options:["You're welcome","Please","Thank you","I'm sorry"],answer:"You're welcome"}]},{id:"u1l3",title:"Yes, no & sorry",icon:"🙂",teach:[{es:"Sí",en:"Yes",explain:"Use it to agree or to answer a yes-or-no question. The accent mark matters in writing: sí means yes.",example:["¿Café?","Sí."]},{es:"No",en:"No",explain:"Use it to decline or disagree. You can soften it with gracias: No, gracias.",example:["¿Más café?","No, gracias."]},{es:"Perdón",en:"Excuse me",explain:"Use this to get someone's attention, to pass through a crowd, or to apologize for a small slip.",example:["Perdón…","Sí, dime."]}],exercises:[{type:"mc",prompt:"What does this mean?",phrase:"Sí",options:["Yes","No","Please","Hello"],answer:"Yes"},{type:"listen",prompt:"What do you hear?",speak:"Sí",options:["Sí","No","Hola","Gracias"],answer:"Sí"},{type:"mc",prompt:"Translate to Spanish",phrase:"No",options:["No","Sí","Gracias","Hola"],answer:"No"},{type:"tap",prompt:"Translate to Spanish",phrase:"
